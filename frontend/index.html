<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurante Girasoles</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('girasoles_theme_mode');
          var isDark = mode === 'auto'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            : (localStorage.getItem('girasoles_theme') === 'dark');
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var size = localStorage.getItem('girasoles_text_size');
          if (size === 'grande') {
            document.documentElement.style.fontSize = '112.5%';
          } else if (size === 'muy-grande') {
            document.documentElement.style.fontSize = '125%';
          } else {
            document.documentElement.style.fontSize = '100%';
          }

          var reduceMotion = localStorage.getItem('girasoles_reduce_motion');
          var shouldReduce = reduceMotion !== null
            ? (reduceMotion === 'true')
            : (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          if (shouldReduce) {
            document.documentElement.setAttribute('data-reduce-motion', 'true');
          } else {
            document.documentElement.setAttribute('data-reduce-motion', 'false');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
