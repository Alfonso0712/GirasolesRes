version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend/GirasolesRes.Domain"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/backend/GirasolesRes.Application"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/backend/GirasolesRes.Infrastructure"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/backend/GirasolesRes.API"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/tests/GirasolesRes.Tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
