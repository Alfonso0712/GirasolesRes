name: Build and Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Build & Tests (.NET 8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Password123!
          POSTGRES_DB: girasoles_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=girasoles_db;Username=postgres;Password=Password123!"
      MIGRATE_CUS13_SQL_PATH: "${{ github.workspace }}/database/migrate_cus13.sql"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'GirasolesRes.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Initialize PostgreSQL Database
        run: |
          docker run --rm --network host -v ${{ github.workspace }}/database:/db postgres:18-alpine sh -c "PGPASSWORD=Password123! psql -h localhost -p 5432 -U postgres -d girasoles_db -f /db/init_girasoles_db.sql"

      - name: Restore dependencies
        run: dotnet restore GirasolesRes.sln

      - name: Build Solution (Release)
        run: dotnet build GirasolesRes.sln --no-restore --configuration Release

      - name: Run Unit & Integration Tests (xUnit)
        run: dotnet test GirasolesRes.sln --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend Typecheck & Build (Vite + React 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile and Build Frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build
