services:
  postgres:
    image: postgres:17
    container_name: girasoles-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-girasoles_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - girasoles_postgres_data:/var/lib/postgresql/data
      - ./database/init_girasoles_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-girasoles_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: girasoles-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5050
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-girasoles_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      - Jwt__SecretKey=${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY en .env}
      - Jwt__Issuer=${JWT_ISSUER:-GirasolesRes}
      - Jwt__Audience=${JWT_AUDIENCE:-GirasolesResApp}
      - Jwt__ExpiracionMinutos=${JWT_EXPIRACION_MINUTOS:-30}
      - ApisPeru__BaseUrl=${APISPERU_BASE_URL:-https://dniruc.apisperu.com/api/v1}
      - ApisPeru__Token=${APISPERU_TOKEN:-}
      - Email__ApiKey=${EMAIL_API_KEY:-}
      - Email__SecretKey=${EMAIL_SECRET_KEY:-}
      - Email__FromEmail=${EMAIL_FROM_EMAIL:-no-reply@girasolesres.pp.ua}
      - Email__FromName=${EMAIL_FROM_NAME:-Restaurante Girasoles}
      - Email__DestinatarioDePrueba=${EMAIL_DESTINATARIO_PRUEBA:-}
      - Seed__Habilitado=${SEED_HABILITADO:-false}
      - Seed__PasswordInicial=${SEED_PASSWORD_INICIAL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  girasoles_postgres_data:
